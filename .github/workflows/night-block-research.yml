name: NEID night-block research validation
on:
  push:
    branches: ['research/**']
  pull_request:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m pytest -q tests/test_night_block_audit.py
      - run: python scripts/run_night_block_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: neid-night-block-diagnostics
          path: |
            research/night-block-audit-results.json
            research/night-block-audit.png
