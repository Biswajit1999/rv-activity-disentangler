name: Scientific sensitivity regression
on:
  pull_request:
    paths:
      - 'research/*20261107.py'
      - 'tests/*20261107.py'
      - '.github/workflows/scientific-sensitivity-20261107.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_rv_robustness_20261107.py' -v
